<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You - Yume Bakery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            color: #5a3825;
            text-align: center;
        }

        .thank-you {
            max-width: 700px;
            margin: 120px auto;
            padding: 60px 30px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 25px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }

        .message {
            margin-top: 30px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 30px;
            background-color: #8b451f;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
        }

        a:hover {
            opacity: 0.8;
        }
    </style>

</head>

<body>

    <div class="thank-you">

        <h1>Thank You! ♡</h1>

        <p>
            Your order has been received successfully.
        </p>
        <a href="https://yumebakery-japan.github.io/yumebakery/">
            Back to Yume Bakery
        </a>

    </div>

</body>

</html>
